# nginx site for https://hdviewer.unav.edu (one uvicorn process on 127.0.0.1:8000).
# The API serves the React app, BokehJS, image tiles and the events socket on one
# port, so a single location is enough. Install as /etc/nginx/sites-available/hdviewer
# and adjust the certificate paths.

server {
    listen 80;
    server_name hdviewer.unav.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hdviewer.unav.edu;

    ssl_certificate     /etc/ssl/certs/hdviewer.unav.edu.crt;
    ssl_certificate_key /etc/ssl/private/hdviewer.unav.edu.key;

    # Uploads arrive in 4 MiB chunks (settings.UPLOAD_CHUNK_BYTES); leave headroom
    client_max_body_size 16m;

    # Binary layer frames and json_item figures compress well
    gzip on;
    gzip_types application/octet-stream application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Session events (progress, jobs): a long-lived WebSocket
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;          # stream upload chunks
        proxy_read_timeout 600;               # long analyses answer within a request
    }
}
