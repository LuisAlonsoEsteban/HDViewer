# Publish the image tags used by the deconvolution manifests.
# CIBERSORTx uses its official upstream image and is not republished.
name: Deconvolution plugin images

on:
  push:
    branches: [main]
    paths:
      - "hd_viewer/board/operations/layer/deconvolution/api/plugins/**"
      - "hd_viewer/board/operations/layer/deconvolution/api/sdk/**"
      - ".github/workflows/deconvolution-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [nnls, cell2location, music]
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          image=$(awk '/^image:/ { print $2; exit }' "hd_viewer/board/operations/layer/deconvolution/api/plugins/$PLUGIN/manifest.yaml")
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hd_viewer/board/operations/layer/deconvolution/api
          file: hd_viewer/board/operations/layer/deconvolution/api/plugins/${{ matrix.plugin }}/Dockerfile
          push: true
          tags: ${{ steps.manifest.outputs.image }}
