# Publishes the container images of the segmentation plugins.
# Every plugin folder with a Dockerfile is built from hd_viewer/startup/data/image/segmentation/api/ and pushed
# under the `image:` named in its manifest.yaml, so the viewer pulls ready-made images.
# Bump `version` and the image tag in a manifest whenever the method's results change.
# See docs/plugins.md.
name: Segmentation plugin images

on:
  push:
    branches: [main]
    paths:
      - "hd_viewer/startup/data/image/segmentation/api/plugins/**"
      - "hd_viewer/startup/data/image/segmentation/api/sdk/**"
      - ".github/workflows/segmentation-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          plugins=$(ls hd_viewer/startup/data/image/segmentation/api/plugins/*/Dockerfile | awk -F/ '{print $(NF-1)}' | jq -R . | jq -cs .)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.list.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          image=$(awk '/^image:/ { print $2; exit }' "hd_viewer/startup/data/image/segmentation/api/plugins/$PLUGIN/manifest.yaml")
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hd_viewer/startup/data/image/segmentation/api
          file: hd_viewer/startup/data/image/segmentation/api/plugins/${{ matrix.plugin }}/Dockerfile
          push: true
          tags: ${{ steps.manifest.outputs.image }}
