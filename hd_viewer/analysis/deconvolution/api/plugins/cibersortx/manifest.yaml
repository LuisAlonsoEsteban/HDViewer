name: cibersortx
version: 0.1.0
image: cibersortx/fractions:latest
title: CIBERSORTx
description: Generate a single-cell signature and estimate relative fractions using
  the official container. Requires server credentials.
url: https://cibersortx.stanford.edu/
citation: Newman et al., Nature Biotechnology (2019)
runners:
- docker
- apptainer
input_mount: /src/data
output_mount: /src/outdir
params:
- name: g_min
  type: int
  default: 300
  min: 1
  label: Minimum signature genes per type
- name: g_max
  type: int
  default: 500
  min: 1
  label: Maximum signature genes per type
- name: q_value
  type: float
  default: 0.01
  min: 1.0e-08
  max: 1
  label: Signature q-value
- name: replicates
  type: int
  default: 5
  min: 1
  label: Signature replicates
- name: sampling
  type: float
  default: 0.5
  min: 1.0e-08
  max: 1
  label: Signature sampling fraction
- name: fraction
  type: float
  default: 0.75
  min: 0
  max: 1
  label: Expression detection fraction
- name: perm
  type: int
  default: 0
  min: 0
  label: Permutations
- name: batch_correction
  type: choice
  default: none
  choices:
  - none
  - S
  - B
  label: Batch correction
- name: quantile_normalization
  type: bool
  default: false
  label: Quantile normalization
reference_params:
- g_min
- g_max
- q_value
- replicates
- sampling
- fraction
