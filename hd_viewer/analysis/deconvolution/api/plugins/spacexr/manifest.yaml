name: spacexr
version: 0.2.0
image: ghcr.io/luisalonsoesteban/visium-deconv-spacexr:0.2.0
title: spacexr (RCTD)
description: Robust Cell Type Decomposition with platform-effect normalization. Requires
  raw integer counts and at least two reference cell types. Fits the whole layer;
  rejected, uncertain doublets, and filtered observations remain unassigned.
url: https://raw.githack.com/dmcable/spacexr/master/vignettes/spatial-transcriptomics.html
citation: Cable et al., Nature Biotechnology (2022)
params:
- name: doublet_mode
  type: choice
  default: doublet
  choices: [doublet, full, multi]
  label: RCTD mode
  help: Doublet fits at most two types; full allows all types; multi uses MAX_MULTI_TYPES.
- name: max_cores
  type: int
  default: 4
  min: 1
  label: R workers (capped by the runner thread budget)
- name: gene_cutoff
  type: float
  default: 0.000125
  min: 0
  label: Normalization gene expression cutoff
- name: fc_cutoff
  type: float
  default: 0.5
  min: 0
  label: Normalization gene log-fold-change cutoff
- name: gene_cutoff_reg
  type: float
  default: 0.0002
  min: 0
  label: Regression gene expression cutoff
- name: fc_cutoff_reg
  type: float
  default: 0.75
  min: 0
  label: Regression gene log-fold-change cutoff
- name: UMI_min
  type: int
  default: 100
  min: 1
  label: Minimum target UMIs
- name: UMI_max
  type: int
  default: 20000000
  min: 1
  label: Maximum target UMIs
- name: counts_MIN
  type: int
  default: 10
  min: 1
  label: Minimum target counts in selected genes
- name: UMI_min_sigma
  type: int
  default: 300
  min: 1
  label: Minimum target UMIs for sigma estimation
- name: CELL_MIN_INSTANCE
  type: int
  default: 25
  min: 2
  label: Minimum reference cells per type after filtering
- name: reference_min_UMI
  type: int
  default: 100
  min: 1
  label: Minimum reference cell UMIs
- name: n_max_cells
  type: int
  default: 10000
  min: 2
  label: Maximum reference cells per type
- name: MAX_MULTI_TYPES
  type: int
  default: 4
  min: 2
  label: Maximum types per observation (multi mode)
- name: seed
  type: int
  default: 0
  min: 0
  max: 2147483647
  label: Random seed
reference_params: [reference_min_UMI, n_max_cells, CELL_MIN_INSTANCE, seed]
